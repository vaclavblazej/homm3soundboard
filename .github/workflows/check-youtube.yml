name: Check YouTube videos

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ['src/config/**', 'scripts/check-youtube.ts']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node >= 22.18 runs .ts files natively (type stripping); no deps needed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:youtube
